name: Update playlist

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download M3U
        env:
          SRC: ${{ secrets.M3U_SOURCE_URL }}
        run: curl -fsSL "$SRC" -o playlist.m3u

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s playlist.m3u || { echo "playlist.m3u is empty"; exit 1; }
          mkdir out && mv playlist.m3u out/ && cd out
          git init -b data
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playlist.m3u
          git commit -m "Update playlist $(date -u +%F)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
