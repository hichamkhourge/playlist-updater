name: Update playlist

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download M3U
        env:
          SRC: ${{ secrets.M3U_SOURCE_URL }}
        run: curl -fsSL "$SRC" -o playlist.m3u

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s playlist.m3u || { echo "playlist.m3u is empty"; exit 1; }
          gh release view playlist >/dev/null 2>&1 || \
            gh release create playlist --title "playlist" --notes "Auto-updated playlist"
          gh release upload playlist playlist.m3u --clobber
