name: Update playlist

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download M3U
        env:
          SRC: ${{ secrets.M3U_SOURCE_URL }}
        run: curl -fsSL "$SRC" -o full.m3u

      - name: Remove movies and series
        run: |
          awk '
          { sub(/\r$/,"") }
          /^#EXTM3U/ { print; next }
          /^#EXTINF/ { inf=$0; next }
          /^#/ { if (inf!="") inf=inf "\n" $0; next }
          NF==0 { next }
          { if (inf!="" && $0 !~ /\/(movie|series)\//) print inf "\n" $0; inf="" }
          ' full.m3u > playlist.m3u
          echo "Channels kept: $(grep -c '^#EXTINF' playlist.m3u)"
          SIZE=$(stat -c %s playlist.m3u)
          echo "Size: $SIZE bytes"
          [ "$SIZE" -gt 100 ] || { echo "Filtered file is empty"; exit 1; }
          [ "$SIZE" -lt 33554432 ] || { echo "Still over 32 MB"; exit 1; }

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view playlist >/dev/null 2>&1 || \
            gh release create playlist --title "playlist" --notes "Auto-updated playlist"
          gh release upload playlist playlist.m3u --clobber
